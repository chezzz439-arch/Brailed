org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Pin the Gradle daemon JVM. The default JDK on this machine is 25, which
# Gradle 8.9 rejects; Android Studio's bundled JDK 21 is compatible. This makes
# `./gradlew` work from the CLI without exporting JAVA_HOME. Machine-specific
# path — override on other machines/CI (or drop once the wrapper moves past 9.1).
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
