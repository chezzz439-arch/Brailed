; ---------------------------------------------------------------------------
; Portable Braille — ESP32 firmware (PlatformIO)
;
; ONE codebase (src/main.cpp), TWO build environments toggled by ENABLE_BLE:
;
;   esp32dev_noble  ENABLE_BLE=0  radio OFF — the proven-stable configuration.
;                                 TextInput packets are printed to Serial and
;                                 caption/command strings are accepted back over
;                                 Serial, so the full chord -> protocol -> phone
;                                 -> Jac path can be exercised with the radio off.
;
;   esp32dev        ENABLE_BLE=1  radio ON — NimBLE GATT link. Flip to this only
;                                 for BLE link tests (the brownout env).
;
; Default is the radio-off env so you keep making progress while the hardware
; fix (bulk cap + stiffer 5V supply) is in transit.
;
;   Radio-off dev:   pio run -e esp32dev_noble -t upload -t monitor
;   BLE link test:   pio run -e esp32dev       -t upload -t monitor
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32dev_noble

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; NimBLE is PINNED EXACTLY (not floating). The BLE code in main.cpp targets the
; 1.4.x API — NimBLEDevice::setPower(esp_power_level_t, esp_ble_power_type_t),
; the single-arg onWrite/onConnect callback signatures, and getValue().c_str().
; NimBLE-Arduino 2.x changed all of these (setPower takes int8_t dBm, callbacks
; gain a NimBLEConnInfo& param). Do NOT bump to 2.x without updating main.cpp.
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.3
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1

; NimBLE is far leaner than Bluedroid, so the DEFAULT partition table fits it —
; huge_app.csv is no longer required. Uncomment only if you later add large
; features and the app partition overflows.
; board_build.partitions = huge_app.csv

[env:esp32dev]
build_flags = -D ENABLE_BLE=1

[env:esp32dev_noble]
build_flags = -D ENABLE_BLE=0
